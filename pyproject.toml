[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Временная Python-only сборка: C++ ядро не компилируется.
# Когда подключим настоящий _p2pcore, заменим backend на scikit-build-core (см. ARCHITECTURE.md, 4.2).

[project]
name = "p2pshare"
version = "0.1.0"
description = "P2P обмен файлами в локальной сети (семестровая работа)"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout", "ruff"]

[project.scripts]
p2pshare = "p2pshare.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 60

[tool.ruff]
line-length = 100
